<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skularis</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/design-tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/dark-bubble.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dialogs.css">
  <link rel="stylesheet" href="css/accessibility.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/skularistool.css">
  <link rel="stylesheet" href="css/infofenster.css">
</head>
<body>
  <!-- Screenreader Live-Regionen -->
  <div id="sr-live" aria-live="assertive" aria-atomic="true" class="sr-only"></div>
  <div id="sr-polite" aria-live="polite" aria-atomic="true" class="sr-only"></div>
  <div id="sr-status" role="status" aria-live="polite" class="sr-only"></div>

  <!-- Kopfzeile mit Barrierefreiheits-Box (oben rechts) -->
  <header class="db-header" role="banner">
    <div class="db-header__left">
      <button id="btn-hauptmenue" class="db-nav-btn" type="button" tabindex="-1" title="Zum Hauptmenü" aria-label="Zum Hauptmenü">H</button>
      <button id="btn-zurueck" class="db-nav-btn" type="button" tabindex="-1" title="Eine Ebene zurück" aria-label="Eine Ebene zurück">&#8592;</button>
      <h1 class="db-header__title">SKULARIS</h1>
    </div>
    <!-- Seit 1.20 reine MAUS-Bedienung (tabindex -1, wie die Navigations-Schalter
         links): kein Tab-Stopp mehr, der die Pfeil-Menü-Welt unterbricht. Dieselben
         Funktionen sind per Tastatur über die Optionen und die umbelegbaren
         Allgemein-Kürzel erreichbar (Strg T Sprache, Schrift- und Lautstärketasten). -->
    <div class="db-header__right" role="group" aria-label="Barrierefreiheit: Sound und Schrift">
      <label class="db-header__volume-label" for="volume-slider">Lautstärke:</label>
      <input type="range" id="volume-slider" class="db-header__volume" tabindex="-1"
             min="0" max="100" value="25" aria-label="Lautstärke">
      <span id="volume-display" class="db-header__volume-value">25</span>
      <button id="btn-sprache-toggle" class="db-header__btn" tabindex="-1" aria-label="Sprachausgabe umschalten">
        <span class="db-header__btn-icon" aria-hidden="true">&#x1F50A;</span>
        <span id="sprache-status-text">Sprache an</span>
      </button>
      <button id="btn-font-plus" class="db-header__btn" tabindex="-1" aria-label="Schrift vergrößern">A+</button>
      <button id="btn-font-minus" class="db-header__btn" tabindex="-1" aria-label="Schrift verkleinern">A−</button>
    </div>
  </header>

  <!-- Hauptbereich: Bildschirme werden hier dynamisch gerendert -->
  <main id="app-content" class="db-main" role="main" aria-label="Hauptinhalt"></main>

  <!-- Gut sichtbare EP-Anzeige unten mittig; nur eingeblendet, wenn EIN Charakter
       geladen ist (Editor, Abenteuertisch). Rein optisch (aria-hidden), Blinde
       hören die EP über die Menüs. -->
  <div id="ep-anzeige" class="ep-anzeige" aria-hidden="true"></div>

  <!-- Statusleiste -->
  <footer class="db-footer" role="contentinfo">
    <div id="status-bar" class="db-status">
      <span id="status-text">Bereit.</span>
    </div>
  </footer>

  <!-- PeerJS (WebRTC) fuer das Online-Radio; setzt window.Peer, wird erst beim
       Verbinden genutzt. Klassisches Script laeuft vor dem Modul. -->
  <script src="assets/vendor/peerjs.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
